projects:
  - slug: lego-bulldozer-production-line
    text: >-
      Eight ABB robots build a LEGO bulldozer every five minutes, team of thirteen. I am responsible for the transport
      system: pneumatic stops, parts at each station on time, every part tracked.
    de:
      title: Fertigungslinie für einen LEGO-Bulldozer
      text: >-
        Acht ABB-Roboter bauen alle fünf Minuten einen LEGO-Bulldozer, Team von dreizehn. Ich verantworte den
        Transport: pneumatische Stopper, pünktliche Teile, Teileverfolgung.
  - slug: traffic-sound-profiling
    text: >-
      Solo. A Raspberry Pi that profiles traffic by sound alone: CUSUM change detection, three classifiers compared in
      MATLAB (including k-NN and a 1D CNN). Graded 9/10.
    de:
      title: Verkehr am Geräusch erkennen
      text: >-
        Allein umgesetzt. Raspberry Pi erkennt Verkehr am Geräusch: CUSUM, drei Klassifikatoren in MATLAB verglichen
        (u. a. k-NN, 1D-CNN). Note 9/10.
  - slug: mis-purchase-orders
    title: Purchase order request system on the Power Platform
    text: >-
      Rebuilt the finance team's purchase order requests in Power Apps, replacing a Microsoft Form, Power Automate
      and Excel. Built on contract at Munich International School.
    de:
      title: Bestellanforderungssystem auf der Power Platform
      text: >-
        Bestellanforderungen der Finanzabteilung in Power Apps neu gebaut, statt Microsoft Forms, Power Automate und
        Excel. Auf Vertragsbasis an der Munich International School.
  - slug: support-ticketing-system
    text: >-
      Built on Discord for online communities in the entertainment space, connected to the APIs they already use.
      Sold commercially on two marketplaces to almost ten customers.
    de:
      title: Support- und Ticketsystem
      text: >-
        Auf Discord aufgebaut, für Online-Communities im Unterhaltungsbereich, mit deren bestehenden APIs verbunden.
        Auf zwei Marktplätzen kommerziell an fast zehn Kunden verkauft.
