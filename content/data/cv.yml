projects:
  - slug: lego-bulldozer-production-line
    text: >-
      Eight ABB robots build a LEGO bulldozer every five minutes, team of thirteen. I am responsible for the transport
      system: pneumatic stops, parts at each station on time, every part tracked.
    de:
      title: Fertigungslinie für einen LEGO-Bulldozer
      text: >-
        Acht ABB-Roboter bauen alle fünf Minuten einen LEGO-Bulldozer, Team von dreizehn. Ich verantworte den
        Transport: pneumatische Stopper, pünktliche Teile, Teileverfolgung.
  - slug: traffic-sound-profiling
    text: >-
      Solo. A Raspberry Pi that profiles traffic by sound alone: CUSUM change detection, three classifiers compared in
      MATLAB (including k-NN and a 1D CNN). Graded 9/10.
    de:
      title: Verkehr am Geräusch erkennen
      text: >-
        Allein umgesetzt. Raspberry Pi erkennt Verkehr am Geräusch: CUSUM, drei Klassifikatoren in MATLAB verglichen
        (u. a. k-NN, 1D-CNN). Note 9/10.
  - slug: scan-assistant
    text: >-
      Chrome extension that scans the school's iPads in and out of Snipe-IT against class lists. My idea and
      prototype, built largely with AI coding tools. In use.
    de:
      text: >-
        Chrome-Erweiterung, die iPads in Snipe-IT ein- und auscheckt und mit Klassenlisten abgleicht. Idee und
        Prototyp von mir, größtenteils mit KI-Werkzeugen gebaut. Im Einsatz.
  - slug: kino
    text: >-
      On my own server: Python and FastAPI behind nginx, Android TV app, nightly backups. Code on GitHub.
    de:
      title: Kino, eine Streaming-Plattform für meine Familie
      text: >-
        Auf eigenem Server: Python und FastAPI hinter nginx, Android-TV-App, nächtliche Backups. Code auf GitHub.
