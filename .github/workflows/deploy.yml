name: Deploy reece.page

on:
  push:
    branches: [main]
  # Pull requests get the checks only, they go live once merged
  pull_request:
  # Lets you rerun the deploy from the Actions tab
  workflow_dispatch:

# One deploy at a time, a second merge waits for the first instead of both pulling at once
concurrency:
  group: deploy-reece-page
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lint, the unit and integration tests and the content check, a broken change stops here and never reaches
      # the server
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Deploy scripts parse
        run: bash -n deploy/update.sh && bash -n deploy/release.sh

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.REECE_PAGE_DEPLOY_KEY }}
          # The admin sign in and the GitHub sync, set under Settings > Secrets and variables > Actions. They go to
          # the server on stdin and from there into .env, an empty or missing one leaves whats there alone
          SIMPLELOGIN_CLIENT_ID: ${{ secrets.SIMPLELOGIN_CLIENT_ID }}
          SIMPLELOGIN_CLIENT_SECRET: ${{ secrets.SIMPLELOGIN_CLIENT_SECRET }}
          ADMIN_SIMPLELOGIN_ID: ${{ secrets.ADMIN_SIMPLELOGIN_ID }}
          GITHUB_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -q -H "$HOST" >> ~/.ssh/known_hosts
          # The key is locked to reece-page-update on the server (like kino), whatever command is sent that is the
          # only thing it runs. It pulls, builds, migrates, restarts and fails this step if the site doesnt come back
          printf 'SIMPLELOGIN_CLIENT_ID=%s\nSIMPLELOGIN_CLIENT_SECRET=%s\nADMIN_SIMPLELOGIN_ID=%s\nGITHUB_SYNC_TOKEN=%s\n' \
            "$SIMPLELOGIN_CLIENT_ID" "$SIMPLELOGIN_CLIENT_SECRET" "$ADMIN_SIMPLELOGIN_ID" "$GITHUB_SYNC_TOKEN" \
            | ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "root@$HOST" reece-page-update
